[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# NOTE: the PyPI distribution name is "orca-workbench" (the plain "orca-studio"
# was already taken on PyPI by an unrelated ORCA output-parsing package). The
# *import* package is still `orca_studio` and the launch command is still
# `orca-studio` — only `pip install orca-workbench` differs.
[project]
name = "orca-workbench"
version = "1.2.0"
description = "Desktop GUI for building, launching, monitoring, and analysing ORCA quantum-chemistry calculations on SLURM clusters"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Christian Nelle" },
]
keywords = [
    "orca", "quantum chemistry", "computational chemistry",
    "slurm", "hpc", "dft", "gui", "tkinter", "spectroscopy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "rdkit",
    "openbabel-wheel",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/ACH-Repo/ACH-Orca-Workbench"
Documentation = "https://ach-repo.github.io/ACH-Orca-Workbench/"
Repository = "https://github.com/ACH-Repo/ACH-Orca-Workbench"
Issues = "https://github.com/ACH-Repo/ACH-Orca-Workbench/issues"

[project.scripts]
orca-studio = "orca_studio.__main__:_cli"

[tool.setuptools]
packages = ["orca_studio", "orca_studio.core", "orca_studio.ui"]

[tool.setuptools.package-data]
orca_studio = ["data/*.sh", "data/recipes/*.json"]
